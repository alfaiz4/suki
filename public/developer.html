<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NeoGroup — Info Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
:root{
  --bg:#f5f6f7;--surface:#ffffff;--text:#14161a;--muted:#6b7078;--line:#e2e4e8;
  --btn:#14161a;--btn-text:#f5f6f7;--tile:#eceef1;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013;--surface:#16191d;--text:#eef0f3;--muted:#8b919a;--line:#262a30;
    --btn:#eef0f3;--btn-text:#0e1013;--tile:#1c2026;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1013;--surface:#16191d;--text:#eef0f3;--muted:#8b919a;--line:#262a30;
  --btn:#eef0f3;--btn-text:#0e1013;--tile:#1c2026;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;transition:background .3s,color .3s}
h1,p,dl,dd{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--text)}
:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.top{display:flex;align-items:center;gap:14px;padding:16px 20px;max-width:56rem;margin:0 auto}
.brand{font-weight:600;font-size:22px;letter-spacing:-.02em;margin-right:auto}
.stage{display:flex;justify-content:center;padding:32px 20px 64px}
.col{width:100%;max-width:24rem}

.switch{position:relative;width:62px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--tile);transition:background .3s,border-color .3s}
.switch .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--btn);color:var(--btn-text);display:grid;place-items:center;transition:transform .35s cubic-bezier(.5,1.4,.5,1)}
.switch[aria-checked="true"] .knob{transform:translateX(28px)}
.switch svg{width:15px;height:15px;grid-area:1/1;transition:opacity .2s,transform .35s}
.switch .moon{opacity:0;transform:rotate(-60deg) scale(.6)}
.switch[aria-checked="true"] .sun{opacity:0;transform:rotate(60deg) scale(.6)}
.switch[aria-checked="true"] .moon{opacity:1;transform:none}

.back{display:inline-block;color:var(--muted);text-decoration:none;font-size:15px;margin-bottom:20px}
.back:hover{color:var(--text)}
.title{font-size:34px;line-height:1.1;letter-spacing:-.03em;font-weight:500;margin-bottom:8px}
.sub{color:var(--muted);font-weight:300;margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 24px;transition:background .3s,border-color .3s}
.row{padding:16px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
dt{color:var(--muted);font-size:14px}
dd{font-weight:500;overflow-wrap:anywhere}
.btn{display:inline-block;margin-top:8px;padding:10px 22px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-weight:500;transition:border-color .2s}
.btn:hover{border-color:var(--text)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="top">
    <span class="brand">NeoGroup</span>
    <button class="switch" id="theme" role="switch" aria-checked="false" aria-label="Mode gelap">
      <span class="knob">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </span>
    </button>
  </header>

  <main class="stage">
    <div class="col">
      <a class="back" href="home.html">← Kembali ke beranda</a>
      <h1 class="title">Contact Support & Dev</h1>
      <p class="sub">Thank You For Support.</p>
      <dl class="card">
        <div class="row"><dt>Nama</dt><dd>Michael J.P</dd></div>
        <div class="row"><dt>Peran</dt><dd>Devloper(FO)</dd></div>
        <div class="row"><dt>WhatsApp</dt><dd><a class="btn" href="https://wa.me/6283144880038" target="_blank" rel="noopener">WhatsApp</a></dd></div>
        <div class="row"><dt>Instagram</dt><dd><a class="btn" href="https://instagram.com/alfzprtm4" target="_blank" rel="noopener">Instagram</a></dd></div>
      </dl>
    </div>
  </main>

  <script>
    const root = document.documentElement;
    const sw = document.getElementById("theme");
    const isDark = () => root.dataset.theme
      ? root.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const syncSwitch = () => sw.setAttribute("aria-checked", isDark());
    try {
      const t = localStorage.getItem("polos-tema");
      if (t === "dark" || t === "light") root.dataset.theme = t;
    } catch (e) {}
    syncSwitch();
    sw.addEventListener("click", () => {
      const next = isDark() ? "light" : "dark";
      root.dataset.theme = next;
      syncSwitch();
      try { localStorage.setItem("polos-tema", next); } catch (e) {}
    });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncSwitch);
  </script>
</body>
</html>
