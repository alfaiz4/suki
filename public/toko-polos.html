
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeoGroup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f7;--surface:#ffffff;--text:#14161a;--muted:#6b7078;--line:#e2e4e8;
  --btn:#14161a;--btn-text:#f5f6f7;--tile:#eceef1;--sat:52%;--lum:58%;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013;--surface:#16191d;--text:#eef0f3;--muted:#8b919a;--line:#262a30;
    --btn:#eef0f3;--btn-text:#0e1013;--tile:#1c2026;--sat:38%;--lum:64%;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1013;--surface:#16191d;--text:#eef0f3;--muted:#8b919a;--line:#262a30;
  --btn:#eef0f3;--btn-text:#0e1013;--tile:#1c2026;--sat:38%;--lum:64%;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;transition:background .3s,color .3s}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--text);outline-offset:3px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.brand{font-weight:600;font-size:22px;letter-spacing:-.02em;margin-right:auto}
.home-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;margin-bottom:18px;transition:color .2s}
.home-link:hover{color:var(--text)}
.home-link svg{flex-shrink:0}
.cart-btn{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;display:flex;gap:8px;align-items:center;transition:border-color .2s}
.cart-btn:hover{border-color:var(--text)}
.count{background:var(--btn);color:var(--btn-text);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:13px;font-weight:500;padding:0 6px}

/* saklar tema bulat */
.switch{position:relative;width:62px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--tile);padding:0;transition:background .3s,border-color .3s}
.switch .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--btn);color:var(--btn-text);display:grid;place-items:center;transition:transform .35s cubic-bezier(.5,1.4,.5,1)}
.switch[aria-checked="true"] .knob{transform:translateX(28px)}
.switch svg{width:15px;height:15px;grid-area:1/1;transition:opacity .2s,transform .35s}
.switch .moon{opacity:0;transform:rotate(-60deg) scale(.6)}
.switch[aria-checked="true"] .sun{opacity:0;transform:rotate(60deg) scale(.6)}
.switch[aria-checked="true"] .moon{opacity:1;transform:none}

main{max-width:1080px;margin:0 auto;padding:0 20px 80px}
.hero{padding:72px 0 48px;max-width:640px}
.hero h1{font-size:clamp(34px,7vw,58px);line-height:1.08;letter-spacing:-.035em;font-weight:500;margin:0 0 16px}
.hero p{color:var(--muted);font-size:18px;font-weight:300;margin:0;max-width:46ch}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px 22px}
.art{aspect-ratio:1;background:var(--tile);border-radius:6px;display:grid;place-items:center;position:relative;overflow:hidden;transition:background .3s}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shape{width:44%;aspect-ratio:1;background:hsl(var(--h) var(--sat) var(--lum));transition:background .3s}
.c{border-radius:50%}.s{border-radius:8px}
.t{width:30%;aspect-ratio:1/1.55;border-radius:999px}
.q{border-radius:50% 50% 8px 8px}
.info{display:flex;justify-content:space-between;gap:12px;padding:12px 2px 10px}
.name{font-weight:500}
.desc{color:var(--muted);font-size:14px;font-weight:300}
.price{font-variant-numeric:tabular-nums;white-space:nowrap}
.add{width:100%;border:1px solid var(--line);background:none;border-radius:999px;padding:9px;transition:background .2s,color .2s,border-color .2s}
.add:hover{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:14px;text-align:center;padding:28px 20px}

/* keranjang */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
.veil.open{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:9;transform:translateX(100%);transition:transform .3s ease,background .3s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside.open{transform:none}
.ah{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.ah h2{margin:0;font-size:18px;font-weight:500}
.x{background:none;border:0;font-size:26px;line-height:1;padding:0 4px}
.items{flex:1;overflow-y:auto;padding:8px 20px}
.empty{color:var(--muted);text-align:center;margin-top:48px}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.row .art{border-radius:4px}
.row .shape{width:50%}.row .t{width:34%}
.qty{display:flex;align-items:center;gap:10px;margin-top:4px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;line-height:1;padding:0}
.qty button:hover{border-color:var(--text)}
.af{padding:18px 20px;border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;font-weight:500;font-size:18px;margin-bottom:14px}
.pay{width:100%;border:0;border-radius:999px;background:var(--btn);color:var(--btn-text);padding:13px;font-weight:500}
.pay:disabled{opacity:.35;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--btn);color:var(--btn-text);padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;z-index:20;font-size:15px;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">NeoGroup</span>
    <button class="switch" id="theme" role="switch" aria-checked="false" aria-label="Mode gelap">
      <span class="knob">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </span>
    </button>
    <button class="cart-btn" id="open-cart" aria-label="Buka keranjang">Keranjang <span class="count" id="count">0</span></button>
  </div>
</header>

<main>
  <section class="hero">
    <a href="https://neogroup.my.id" class="home-link" aria-label="Kembali ke beranda">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      <span>Beranda</span>
    </a>
    <h1>Your Digital Solution.</h1>
    <p>Solusi untuk kebutuhan digital.</p>
  </section>
  <section class="grid" id="grid" aria-label="Daftar produk"></section>
</main>
<footer>Powerd By Neogroup.</footer>

<div class="veil" id="veil"></div>
<aside id="cart" aria-label="Keranjang belanja" aria-hidden="true">
  <div class="ah"><h2>Keranjang</h2><button class="x" id="close-cart" aria-label="Tutup keranjang">×</button></div>
  <div class="items" id="items"></div>
  <div class="af">
    <div class="total"><span>Total</span><span id="total">Rp0</span></div>
    <div id="warn" hidden style="border:1px solid #b54708;color:#b54708;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px"></div>
    <button class="pay" id="pay">Bayar sekarang</button>
  </div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shop.js"></script>
<script>
/* KONFIGURASI: ganti dengan nomor WhatsApp toko (format internasional, tanpa + dan tanpa spasi) */
const WA_NUMBER='6283144880038'; // contoh: 6281234567890
const STORE_NAME='NeoGroup';

/* GAMBAR PRODUK: tambahkan img:'nama-file.jpg' pada produk yang ingin diberi foto.
   Tanpa img, atau jika file gagal dimuat, bentuk geometris tampil sebagai cadangan. */
let PRODUCTS=[
  {id:1,img:'https://files.catbox.moe/z1mkq4.jpeg',name:'Apple Music',desc:'Apple Music Premium 1 Bulan',price:15000,h:210,s:'c'},
  {id:2,img:'https://files.catbox.moe/gsb7yz.jpeg',name:'Unblock Imei 1B',desc:'Unblock Imei 1 Bulan Cepat Dan Bergaransi',price:160000,h:35,s:'s'},
  {id:3,img:'https://files.catbox.moe/gsb7yz.jpeg',name:'Unblock Imei 3B',desc:'Unblock Imei 3 Bulan Cepat Dan Bergaransi',price:230000,h:150,s:'s'},
  {id:4,img:'https://files.catbox.moe/o1l4jz.jpeg',name:'Esim Roaming 3D',desc:'Esim Roaming Instant Bebas akses 1GB 3 Hari',price:15000,h:48,s:'q'},
  {id:5,img:'https://files.catbox.moe/o1l4jz.jpeg',name:'Esim Roaming 15D',desc:'Esim Roaming Instant Bebas Akses 2GB 15Hari',price:25000,h:190,s:'t'},
  {id:6,img:'https://files.catbox.moe/vmi0w9.jpeg',name:'Esim Roaming 30D',desc:'Esim Roaming Instant 5GB 30 Hari',price:60000,h:15,s:'q'},
  {id:7,img:'https://files.catbox.moe/vmi0w9.jpeg',name:'Esim Roaming 10G30D',desc:'Esim Roaming Instant 10GB 30 Hari',price:115000,h:260,s:'c'},
  {id:8,img:'https://files.catbox.moe/kki2rv.jpeg',name:'Wink Pro',desc:'Wink Pro 1 Bulan Ios Only Full Garansi',price:45000,h:340,s:'s'}
];
const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n).replace(/\s/g,'');
const $=id=>document.getElementById(id);
const art=p=>`<div class="art" style="--h:${p.h}"><span class="shape ${p.s}"></span>${p.img?`<img src="${p.img}" alt="${p.name}" loading="lazy" onerror="console.warn('Gambar tidak ditemukan:',this.src);this.remove()">`:''}</div>`;

/* ---------- tema ---------- */
const root=document.documentElement, sw=$('theme');
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function syncSwitch(){sw.setAttribute('aria-checked',isDark())}
try{const t=localStorage.getItem('polos-tema');if(t==='dark'||t==='light')root.dataset.theme=t}catch(e){}
syncSwitch();
sw.addEventListener('click',()=>{
  const next=isDark()?'light':'dark';
  root.dataset.theme=next;syncSwitch();
  try{localStorage.setItem('polos-tema',next)}catch(e){}
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncSwitch);

/* ---------- produk ---------- */
const drawGrid=()=>$('grid').innerHTML=PRODUCTS.map(p=>`
  <article>
    ${art(p)}
    <div class="info"><div><div class="name">${p.name}</div><div class="desc">${p.desc}</div></div><div class="price">${rp(p.price)}</div></div>
    <button class="add" data-id="${p.id}">Tambah ke keranjang</button>
  </article>`).join('');
drawGrid();

/* ---------- keranjang ---------- */
let cart={};
try{const c=JSON.parse(localStorage.getItem('polos-keranjang')||'{}');if(c&&typeof c==='object')cart=c}catch(e){}
const save=()=>{try{localStorage.setItem('polos-keranjang',JSON.stringify(cart))}catch(e){}};
let tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}

function render(){
  const ids=Object.keys(cart).filter(id=>PRODUCTS.some(p=>p.id==id));
  let n=0,sum=0;
  $('items').innerHTML=ids.length?ids.map(id=>{
    const p=PRODUCTS.find(x=>x.id==id),q=cart[id];n+=q;sum+=q*p.price;
    return `<div class="row">${art(p)}
      <div><div class="name">${p.name}</div>
        <div class="qty"><button data-dec="${id}" aria-label="Kurangi ${p.name}">−</button><span>${q}</span><button data-inc="${id}" aria-label="Tambah ${p.name}">+</button></div></div>
      <div class="price">${rp(q*p.price)}</div></div>`}).join('')
    :'<p class="empty">Keranjang masih kosong. Pilih barang dari daftar untuk memulai.</p>';
  $('count').textContent=n;$('total').textContent=rp(sum);$('pay').disabled=!n;
}
function openCart(o){
  $('cart').classList.toggle('open',o);$('veil').classList.toggle('open',o);
  $('cart').setAttribute('aria-hidden',!o);
  if(o)$('close-cart').focus();
}
$('grid').addEventListener('click',e=>{
  const b=e.target.closest('.add');if(!b)return;
  const id=b.dataset.id;cart[id]=(cart[id]||0)+1;save();render();
  toast(PRODUCTS.find(p=>p.id==id).name+' ditambahkan');
});
$('items').addEventListener('click',e=>{
  const inc=e.target.closest('[data-inc]'),dec=e.target.closest('[data-dec]');
  if(inc)cart[inc.dataset.inc]++;
  if(dec){const id=dec.dataset.dec;cart[id]--;if(cart[id]<=0)delete cart[id]}
  if(inc||dec){save();render()}
});
function orderViaWhatsApp(){
  const ids=Object.keys(cart).filter(id=>PRODUCTS.some(p=>p.id==id));
  if(!ids.length)return;
  if(!/^\d{10,15}$/.test(WA_NUMBER)){toast('Nomor WhatsApp toko belum diisi di kode.');return}
  let sum=0;
  const lines=ids.map((id,i)=>{
    const p=PRODUCTS.find(x=>x.id==id),q=cart[id];sum+=q*p.price;
    return `${i+1}. ${p.name} x${q} — ${rp(q*p.price)}`;
  });
  const text=`Halo ${STORE_NAME}, saya ingin memesan:\n\n${lines.join('\n')}\n\n*Total: ${rp(sum)}*\n\nMohon info ketersediaan dan cara pembayarannya. Terima kasih.`;
  const a=document.createElement('a');
  a.href=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(text)}`;
  a.target='_blank';a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();
  openCart(false);toast('Membuka WhatsApp…');
}
/* ---------- checkout: buat pesanan di server lalu ke halaman status ---------- */
const warn=m=>{const w=$('warn');w.hidden=!m;w.innerHTML=m||''};
async function checkout(){
  const ids=Object.keys(cart).filter(id=>PRODUCTS.some(p=>p.id==id));
  if(!ids.length)return;
  const btn=$('pay');btn.disabled=true;warn('');
  try{
    const {data:s}=await Shop.sb.auth.getSession();
    if(!s.session){location.href='index.html';return}
    const items=ids.map(id=>({id:String(id),qty:cart[id]}));
    const {data:o,error}=await Shop.sb.rpc('create_order',{p_items:items});
    if(error)throw error;
    cart={};save();
    location.href='status.html?id='+o.id;
  }catch(e){
    const m=Shop.errMsg(e);
    if(m==='LIMIT_ACTIVE')warn('⚠️ Anda sudah memiliki 2 pesanan yang sedang berlangsung. Selesaikan atau batalkan salah satunya di <a href="riwayat.html" style="color:inherit;font-weight:600">Riwayat Transaksi</a> sebelum membuat pesanan baru.');
    else toast('Gagal membuat pesanan: '+m);
    btn.disabled=false;
  }
}
$('pay').addEventListener('click',checkout);
$('open-cart').addEventListener('click',()=>openCart(true));
$('close-cart').addEventListener('click',()=>openCart(false));
$('veil').addEventListener('click',()=>openCart(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape')openCart(false)});
render();
(async()=>{
  try{
    const {data,error}=await Shop.sb.from('products').select('*').eq('active',true).order('created_at');
    if(error||!data||!data.length)return;
    PRODUCTS=data.map(p=>({id:p.id,img:p.img,name:p.name,desc:p.descr,price:p.price,h:p.h,s:p.s}));
    drawGrid();render();
  }catch(e){}
})();
</script>
</body>
</html>
